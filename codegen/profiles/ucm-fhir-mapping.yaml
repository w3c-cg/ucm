# UCM → FHIR R4 mapping overlay for ucm-codegen.
#
# The ontology says nothing about FHIR; this file does. ucm-codegen validates
# every class, property, role and concept named here against the IR, then
# compiles it into a bidirectional adapter (generated/fhir/ucm_fhir_adapter.py).
#
# Field specs (keys are FHIR element paths, dotted for nesting):
#   property       forward path from the node: a term, or a list of hops
#   inverse        collect nodes whose <inverse> property points at this node
#   class          keep collected nodes of this class (subclasses included)
#   roles          keep participations whose assumed role is one of these
#   exclude-roles  drop participations whose assumed role is one of these
#   each           build one backbone element per item from nested field specs
#   via            forward hops taken before inverse (a directive's consent
#                  interaction, then the participations within it); one-way
#   transform      direct | reference | code | concept-coding | class-coding | role-coding | iri
#   map / default  concept term → FHIR code, for transform: code
#   system         for transform: code, write a CodeableConcept in this system
#   coding         for transform: concept-coding, write a bare Coding
#   resource-types for transform: reference, the FHIR types allowed; others warn
#   when           constant sub-elements of an each element (data.meaning);
#                  the reverse direction reads only elements that match
#   one-way        never read back (a projection another field already carries)
#                  (concept-coding writes the UCM concept itself as a
#                  CodeableConcept in the code-system; an adopter's own
#                  concept keeps its IRI in the node-iri extension)
#   single / list  cardinality of the FHIR element (default: single, each: list)
# A key may end in #tag so several fields fill one repeating element
# (securityLabel#sensitivity, securityLabel#confidentiality).
# Collected nodes are tagged with the node-iri extension so the reverse
# direction can rebuild them (paths of one or two hops; longer chains and
# via paths are one-way).

fhir-version: 4.0.1
code-system: https://www.w3.org/ns/ucm#
node-iri-extension: https://www.w3.org/ns/ucm#fhirNode

resources:
  Person:
    resource: Patient
    # A UCM Person is role-neutral; FHIR splits people by role. The first
    # entry matching a role the person assumes in any participation wins.
    # (CaregiverRole → RelatedPerson needs RelatedPerson.patient, which UCM
    # does not state directly, so it is not mapped yet.)
    by-role:
      ProviderRole: Practitioner
      CoordinatorRole: Practitioner

  Organization:
    resource: Organization

  Location:
    resource: Location

  Device:
    resource: Device

  Household:
    resource: Group
    constants:
      type: person
      actual: true
    fields:
      member:
        inverse: membershipIn
        class: Membership
        each:
          entity: {inverse: hasMembership, transform: reference}

  CareTeam:
    resource: CareTeam
    fields:
      participant:
        property: hasMember
        each:
          member: {transform: reference}

  ClinicalEncounter:
    resource: Encounter
    constants:
      status: unknown
      class:
        system: http://terminology.hl7.org/CodeSystem/v3-NullFlavor
        code: UNK
    fields:
      subject: {property: hasPatient, transform: reference}
      participant:
        inverse: occursWithin
        class: Participation
        exclude-roles: [SubjectRole]   # the patient is Encounter.subject, not a participant
        each:
          individual: {property: participatingEntity, transform: reference}
          type: {property: assumesRole, transform: role-coding, list: true}
          period.start: {property: validFrom}
          period.end: {property: validTo}

  CoordinationRequest:
    resource: Task
    constants:
      intent: order
    fields:
      status:
        property: hasLifecycleState
        transform: code
        map: {Pending: requested, Accepted: accepted, Declined: rejected}
        default: draft
      # Proposed: the receiving party's decision and the closure reason as
      # UCM codes. Task.status keeps the coarse FHIR state.
      businessStatus: {property: hasReferralDisposition, transform: concept-coding}
      statusReason: {property: hasClosureReason, transform: concept-coding}
      description: {property: [hasActivityFocus, "rdfs:label"]}
      for:
        {inverse: occursWithin, class: Participation, roles: [SubjectRole],
         property: participatingEntity, transform: reference}
      requester:
        {inverse: occursWithin, class: Participation, roles: [CoordinatorRole],
         property: participatingEntity, transform: reference}
      owner:
        {inverse: occursWithin, class: Participation, roles: [ProviderRole],
         property: participatingEntity, transform: reference}

  DiagnosisStatement:
    resource: Condition
    fields:
      code: {transform: class-coding}
      subject: {property: [statementSubject, participatingEntity], transform: reference}
      recordedDate: {property: statementDate}

  ObservationStatement: &observation
    resource: Observation
    constants:
      status: final
    fields:
      code: {transform: class-coding}
      subject: {property: [statementSubject, participatingEntity], transform: reference}
      effectiveDateTime: {property: statementDate}

  HousingStatement: *observation
  SocialCareStatement: *observation

  # FHIR R4 Consent. R4 has no top-level decision: the root provision is the
  # directive itself, and nested provisions follow two levels deep. R4
  # Consent.patient takes only a Patient, so a household-wide directive
  # leaves it out with a warning (R5 Consent.subject allows a Group).
  ConsentDirective:
    resource: Consent
    fields:
      status:
        property: hasConsentStatus
        transform: code
        map:
          ConsentDraft: draft
          ConsentActive: active
          ConsentInactive: inactive
          ConsentRevoked: inactive
          ConsentExpired: inactive
          ConsentSuperseded: inactive
          ConsentRefused: rejected
          ConsentEnteredInError: entered-in-error
      scope:
        property: hasConsentCategory
        transform: code
        system: http://terminology.hl7.org/CodeSystem/consentscope
        one-way: true   # category carries the exact UCM concept
        map:
          PrivacyConsent: patient-privacy
          ReleaseOfInformation: patient-privacy
          ConsentToCollect: patient-privacy
          ConsentToShare: patient-privacy
          TreatmentConsent: treatment
          ResearchConsent: research
          AdvanceDirective: adr
      category: {property: hasConsentCategory, transform: concept-coding, list: true}
      patient:
        {property: [consentSubject, participatingEntity], transform: reference, resource-types: [Patient]}
      dateTime: {property: [recordsConsentFrom, occursDuring, "time:inXSDDateTimeStamp"]}
      performer:   # R4 performer is the grantor (R5 Consent.grantor)
        {via: recordsConsentFrom, inverse: occursWithin, class: Participation, roles: [ConsentGrantorRole],
         property: participatingEntity, transform: reference, list: true}
      organization:
        {via: recordsConsentFrom, inverse: occursWithin, class: Participation, roles: [InformationCustodianRole],
         property: participatingEntity, transform: reference, list: true}
      sourceReference: {property: sourceDocument, transform: reference}
      policy:
        property: governedByPolicy
        each:
          uri: {transform: iri}
      policyRule: {property: hasRegulatoryBasis, transform: concept-coding}
      provision.type: {property: hasConsentDecision, transform: code, map: {Permit: permit, Deny: deny}}
      provision.period.start: {property: [validDuring, "time:hasBeginning", "time:inXSDDateTimeStamp"]}
      provision.period.end: {property: [validDuring, "time:hasEnd", "time:inXSDDateTimeStamp"]}
      provision.provision:
        property: hasProvision
        class: ConsentProvision
        each:
          <<: &provision
            type: {property: hasConsentDecision, transform: code, map: {Permit: permit, Deny: deny}}
            period.start: {property: [validDuring, "time:hasBeginning", "time:inXSDDateTimeStamp"]}
            period.end: {property: [validDuring, "time:hasEnd", "time:inXSDDateTimeStamp"]}
            actor:
              property: provisionActor
              class: Participation
              each:
                role: {property: assumesRole, transform: role-coding}
                reference: {property: participatingEntity, transform: reference}
            action: {property: governsAction, transform: concept-coding, list: true}
            securityLabel#sensitivity: {property: coversSensitivity, transform: concept-coding, coding: true, list: true}
            securityLabel#confidentiality: {property: coversConfidentiality, transform: concept-coding, coding: true, list: true}
            purpose: {property: forPurpose, transform: concept-coding, coding: true, list: true}
            code: {property: coversDataCategory, transform: concept-coding, list: true}
            dataPeriod.start: {property: [dataPeriod, "time:hasBeginning", "time:inXSDDateTimeStamp"]}
            dataPeriod.end: {property: [dataPeriod, "time:hasEnd", "time:inXSDDateTimeStamp"]}
            data#instance: {property: coversInstance, when: {meaning: instance}, each: {reference: {transform: reference}}}
            data#related: {property: coversRelated, when: {meaning: related}, each: {reference: {transform: reference}}}
            data#dependents: {property: coversDependents, when: {meaning: dependents}, each: {reference: {transform: reference}}}
            data#authoredby: {property: coversAuthoredBy, when: {meaning: authoredby}, each: {reference: {transform: reference}}}
          provision:
            property: hasProvision
            class: ConsentProvision
            each: *provision
