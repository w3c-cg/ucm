# Optional API profile for ucm-codegen.
#
# Everything here is something the ontology cannot say about an HTTP API.
# Without a profile, title/version/description come from the ontology header
# and every root class is exposed as a resource.

title: Unified Care Model API
context-url: ./context.jsonld

servers:
  - url: http://localhost:8000/ucm/v1
    description: UCM reference server

# Root class terms not exposed as resources (schemas are still generated)
exclude: []

# Property term -> concept scheme term. hasLifecycleState -> LifecycleState
# is found by convention; list bindings here when the names differ.
scheme-bindings:
  governsAction: ConsentAction
  forPurpose: PurposeOfUse
  coversDataCategory: InformationCategory
  coversSensitivity: SensitivityCategory
  hasSensitivityLabel: SensitivityCategory
  coversConfidentiality: ConfidentialityLevel
  selfConsentCondition: SelfConsentCondition
  birthDateQuality: BirthDateQuality
  achievedIAL: IdentityAssuranceLevel
  requiresIAL: IdentityAssuranceLevel
  achievedAAL: AuthenticatorAssuranceLevel
  requiresAAL: AuthenticatorAssuranceLevel
  achievedFAL: FederationAssuranceLevel
  hasEvidenceType: IdentityEvidenceType
  # selfConsentScope takes values from several schemes (purposes, consent and
  # information categories, sensitivities), so it is left unbound.
