components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Local identifier of the node. Responses carry its full IRI as @id.
      schema:
        type: string

  responses:
    BadRequest:
      description: The body is not a JSON-LD node object of the expected class.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No node with this identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShapeViolation:
      description: The request graph has Definitional (sh:Violation) results against the UCM core shapes.
      content:
        application/ld+json:
          schema:
            $ref: '#/components/schemas/ValidationReport'

  schemas:
    # ===== Support schemas =====
    "IRI":
      type: string
      format: iri
      description: Absolute IRI, or a term or compact IRI defined by the JSON-LD context.
    "NodeObject":
      type: object
      description: 'Embedded JSON-LD node (e.g., an OWL-Time interval). Open: any predicates.'
      properties:
        '@id':
          $ref: '#/components/schemas/IRI'
        '@type':
          oneOf:
          - type: string
          - type: array
            items:
              type: string
    "NodeRef":
      description: Reference to another node by IRI, or the node embedded inline.
      oneOf:
      - $ref: '#/components/schemas/IRI'
      - $ref: '#/components/schemas/NodeObject'
    "JsonLdContext":
      description: 'JSON-LD @context: the published UCM context URL, an inline context, or both.'
      oneOf:
      - type: string
        format: uri-reference
      - type: object
      - type: array
        items:
          oneOf:
          - type: string
          - type: object
    "Problem":
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    "Severity":
      description: SHACL result severity (sh:Violation, sh:Warning, sh:Info)
      enum:
      - Violation
      - Warning
      - Info
      title: Severity
      type: string
    "Tier":
      description: ucmsh:tier from the UCM core shapes convention
      enum:
      - Definitional
      - Recommended
      title: Tier
      type: string
    "ValidationResult":
      description: One SHACL validation result
      properties:
        focus_node:
          description: Node the result is about
          title: Focus Node
          type: string
        result_path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Property path, if any
          title: Result Path
        value:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Offending value node, if any
          title: Value
        severity:
          $ref: '#/components/schemas/Severity'
        tier:
          anyOf:
          - $ref: '#/components/schemas/Tier'
          - type: 'null'
          default: null
        message:
          title: Message
          type: string
        source_shape:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Shape
      required:
      - focus_node
      - severity
      - message
      title: ValidationResult
      type: object
    "ValidationReport":
      description: SHACL validation report, as returned by write operations
      properties:
        conforms:
          title: Conforms
          type: boolean
        results:
          items:
            $ref: '#/components/schemas/ValidationResult'
          title: Results
          type: array
      required:
      - conforms
      title: ValidationReport
      type: object

    # ===== Concept schemes (open vocabularies) =====
    "LifecycleState":
      description: "Lifecycle State. A state associated with a process during a portion of its lifecycle. Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
      x-semantic-uri: "urn:w3c:cg:ucm#LifecycleState"
      x-ucm-open-vocabulary: true
      x-ucm-concepts:
        Accepted:
          iri: urn:w3c:cg:ucm#Accepted
          label: Accepted Care Coordination Lifecycle
          definition: A care coordination request that has been accepted for ongoing care.
        Declined:
          iri: urn:w3c:cg:ucm#Declined
          label: Declined Care Coordination Lifecycle
          definition: This care request was denied.
        Pending:
          iri: urn:w3c:cg:ucm#Pending
          label: Pending Care Coordination Lifecycle
          definition: A pending care coordination request.
      anyOf:
        - type: string
          enum: ["Accepted", "Declined", "Pending"]
        - $ref: '#/components/schemas/IRI'

    # ===== Ontology classes =====
    "UcmNode":
      type: object
      description: "Any node in a UCM graph, as a JSON-LD node object. Open by default: predicates outside UCM (FHIR, local dictionaries, provenance) are allowed, matching the open-world convention of the UCM shapes."
      x-semantic-uri: "urn:w3c:cg:ucm#"
      properties:
        "@context":
          $ref: '#/components/schemas/JsonLdContext'
          description: "JSON-LD context. Top-level nodes carry the UCM context URL."
        "@id":
          $ref: '#/components/schemas/IRI'
          description: "IRI of the node. Assigned by the server on create if absent."
        "@type":
          type: string
          description: "Class of the node, as a context term."
        "hasCareTrajectoryContext":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "Relates a UCM semantic subject to a temporal position or extent defined relative to the internal progression of a process, state trajectory, or coordinated activity rather than directly relative to an external clock or calendar."
          x-semantic-uri: urn:w3c:cg:ucm#hasCareTrajectoryContext
          x-ucm-range: ucm:CareTrajectoryContext
          x-ucm-constraints:
          - severity: Warning
            tier: Recommended
            message: Care trajectory context is not typed as ucm:CareTrajectoryContext.
        "hasTemporalContext":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "Relates a UCM semantic subject to a temporal entity that qualifies when that subject occurs, obtains, applies, participates, or is otherwise temporally situated."
          x-semantic-uri: urn:w3c:cg:ucm#hasTemporalContext
          x-ucm-range: time:TemporalEntity
          x-ucm-constraints:
          - severity: Violation
            tier: Definitional
            message: Temporal context must be an OWL-Time entity, not a literal. Wrap a bare timestamp in a time:Instant.
          - severity: Violation
            tier: Definitional
            message: Interval ends before it begins.
        "validDuring":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "Relates a semantic subject or statement to the temporal extent during which its described condition, state, relationship, participation, or other semantics apply."
          x-semantic-uri: urn:w3c:cg:ucm#validDuring
          x-ucm-range: time:TemporalEntity
          x-ucm-subproperty-of: ucm:hasTemporalContext
          x-ucm-constraints:
          - severity: Violation
            tier: Definitional
            message: Temporal context must be an OWL-Time entity, not a literal. Wrap a bare timestamp in a time:Instant.
          - severity: Violation
            tier: Definitional
            message: Interval ends before it begins.

    "ActivityFocus":
      type: object
      description: "The matter, condition, or situation toward which a coordinated activity is orchestrated and which the activity seeks to jointly maintain, update, resolve, or bring about."
      x-jsonld-type: "ucm:ActivityFocus"
      x-semantic-uri: "urn:w3c:cg:ucm#ActivityFocus"
      allOf:
        - $ref: '#/components/schemas/UcmNode'
      properties:
        "@type":
          type: string
          enum:
          - ActivityFocus
          description: "Class of the node: this class or one of its subclasses."
      required: ["@type"]
      examples:
        - '@id': http://example.org/ucm/focus-1
          '@type': ActivityFocus
          rdfs:label: Tenancy preservation

    "BehavioralHealthContext":
      type: object
      description: "Behavioral Health Context"
      x-jsonld-type: "ucm:BehavioralHealthContext"
      x-semantic-uri: "urn:w3c:cg:ucm#BehavioralHealthContext"
      allOf:
        - $ref: '#/components/schemas/SemanticContext'
      properties:
        "@type":
          type: string
