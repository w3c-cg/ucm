      x-jsonld-type: "ucm:BehavioralHealthDomain"
      x-semantic-uri: "urn:w3c:cg:ucm#BehavioralHealthDomain"
      allOf:
        - $ref: '#/components/schemas/UcmNode'
      properties:
        "@type":
          type: string
