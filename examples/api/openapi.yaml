      description: "Handoff Status. Where does responsibility for the agreed services stand between the sending and receiving parties? Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
      x-semantic-uri: "https://www.w3.org/ns/ucm#HandoffStatus"
      x-ucm-open-vocabulary: true
      x-ucm-properties: ["hasHandoffStatus"]
      x-ucm-concepts:
        HandoffAcknowledged:
          iri: https://www.w3.org/ns/ucm#HandoffAcknowledged
          label: Acknowledged
          definition: The receiving party has acknowledged the handoff but has not yet assumed responsibility.
        HandoffAssumed:
          iri: https://www.w3.org/ns/ucm#HandoffAssumed
          label: Assumed
          definition: The receiving party has assumed responsibility for the agreed services, and the sending party has released it.
        HandoffDropped:
          iri: https://www.w3.org/ns/ucm#HandoffDropped
          label: Dropped
          definition: The sending party released responsibility before the receiving party assumed it, leaving no one responsible for the agreed services.
        HandoffOffered:
          iri: https://www.w3.org/ns/ucm#HandoffOffered
          label: Offered
          definition: The sending party has offered responsibility for the agreed services; the receiving party has not acknowledged it.
        HandoffReturned:
          iri: https://www.w3.org/ns/ucm#HandoffReturned
          label: Returned
          definition: The receiving party handed responsibility back to the sending party.
        HandoffShared:
          iri: https://www.w3.org/ns/ucm#HandoffShared
          label: Shared
          definition: The sending and receiving parties hold responsibility for the agreed services jointly.
      anyOf:
        - type: string
          enum: ["HandoffAcknowledged", "HandoffAssumed", "HandoffDropped", "HandoffOffered", "HandoffReturned", "HandoffShared"]
        - $ref: '#/components/schemas/IRI'
