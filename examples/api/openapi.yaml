      x-ucm-open-vocabulary: true
      x-ucm-properties: ["achievedFAL"]
      x-ucm-concepts:
        FAL1:
          iri: https://www.w3.org/ns/ucm#FAL1
          label: FAL1
          definition: 'Basic protection: the identity provider signs the assertion with approved cryptography and restricts its audience to a specific relying party or set of relying parties (NIST FAL1).'
        FAL2:
          iri: https://www.w3.org/ns/ucm#FAL2
          label: FAL2
          definition: 'High protection: the assertion is strongly protected from injection attacks and audience-restricted to a single relying party, under a pre-established trust agreement (NIST FAL2).'
        FAL3:
          iri: https://www.w3.org/ns/ucm#FAL3
          label: FAL3
          definition: 'Very high protection: the relying party also verifies that the subscriber controls an authenticator, named in a holder-of-key assertion or bound to the account, which guards against a compromised identity provider (NIST FAL3).'
