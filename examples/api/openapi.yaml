          definition: The HIPAA Privacy Rule (45 CFR Parts 160 and 164).
        HIPAAAuthorization:
          iri: https://www.w3.org/ns/ucm#HIPAAAuthorization
          label: HIPAA authorization
          definition: A HIPAA authorization for a use or disclosure.
