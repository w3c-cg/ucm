          iri: https://www.w3.org/ns/ucm#ConsentActive
          label: Active
          definition: The directive is in force.
        ConsentDraft:
          iri: https://www.w3.org/ns/ucm#ConsentDraft
          label: Draft
          definition: The directive is being prepared and is not yet in force.
        ConsentEnteredInError:
          iri: https://www.w3.org/ns/ucm#ConsentEnteredInError
          label: Entered in error
          definition: The directive was recorded by mistake and should be disregarded.
        ConsentExpired:
          iri: https://w3id.org/dpv#ConsentExpired
          label: Consent Expired
          definition: The state where the temporal or contextual validity of consent has 'expired'
          broader:
