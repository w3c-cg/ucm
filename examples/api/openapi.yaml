        - $ref: '#/components/schemas/IRI'
    "ReferralDisposition":
      description: "Referral Disposition. What has the receiving party decided about a care coordination request? Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
      x-semantic-uri: "https://www.w3.org/ns/ucm#ReferralDisposition"
      x-ucm-open-vocabulary: true
      x-ucm-properties: ["hasReferralDisposition"]
      x-ucm-concepts:
        ReferralAccepted:
          iri: https://www.w3.org/ns/ucm#ReferralAccepted
          label: Accepted
          definition: The receiving party agreed to take part in the requested coordination.
          exactMatch:
          - ucm:Accepted
        ReferralDeclined:
          iri: https://www.w3.org/ns/ucm#ReferralDeclined
          label: Declined
          definition: The receiving party declined the request. The reason is recorded with a ucm:ClosureReason concept.
          exactMatch:
          - ucm:Declined
        ReferralExpired:
          iri: https://www.w3.org/ns/ucm#ReferralExpired
          label: Expired
          definition: The receiving party made no decision within the time allowed for a response.
        ReferralPending:
          iri: https://www.w3.org/ns/ucm#ReferralPending
          label: Pending
          definition: The request has been sent and the receiving party has not yet decided.
          exactMatch:
          - ucm:Pending
        ReferralWithdrawn:
          iri: https://www.w3.org/ns/ucm#ReferralWithdrawn
          label: Withdrawn
          definition: The requesting party withdrew the request before the receiving party decided.
      anyOf:
        - type: string
          enum: ["ReferralAccepted", "ReferralDeclined", "ReferralExpired", "ReferralPending", "ReferralWithdrawn"]
        - $ref: '#/components/schemas/IRI'
    "RegulatoryBasis":
      description: "Regulatory Basis. Which law or regulation does this consent rest on? Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
