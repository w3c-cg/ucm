    # ===== Ontology classes =====
    "UcmNode":
      type: object
      description: "Any node in a UCM graph, as a JSON-LD node object. Open by default: predicates outside UCM (FHIR, local dictionaries, provenance) are allowed, matching the open-world convention of the UCM shapes."
      x-semantic-uri: "https://www.w3.org/ns/ucm#"
      properties:
        "@context":
          $ref: '#/components/schemas/JsonLdContext'
          description: "JSON-LD context. Top-level nodes carry the UCM context URL."
        "@id":
          $ref: '#/components/schemas/IRI'
          description: "IRI of the node. Assigned by the server on create if absent."
        "@type":
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            minItems: 1
          description: "Class of the node, as a context term, or an array of terms (e.g. every OWL individual is also owl:NamedIndividual)."
        "achievedIAL":
          type: array
          items:
            $ref: '#/components/schemas/IdentityAssuranceLevel'
          uniqueItems: true
          description: "Relates an identity proofing process or identity to the identity assurance level it reached."
          x-semantic-uri: https://www.w3.org/ns/ucm#achievedIAL
          x-ucm-concept-scheme: IdentityAssuranceLevel
          x-ucm-range: skos:Concept
        "assertsIdentity":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "Relates an identity assertion or credential to the identity it makes claims about."
          x-semantic-uri: https://www.w3.org/ns/ucm#assertsIdentity
          x-ucm-range: ucm:Identity
          x-ucm-constraints:
          - severity: Warning
            tier: Recommended
            message: assertsIdentity target is not typed as ucm:Identity.
        "assuranceRank":
          type: array
          items:
            type: integer
          uniqueItems: true
          description: "An integer rank on an assurance or strength level, so levels in one scheme can be compared with >=."
          x-semantic-uri: https://www.w3.org/ns/ucm#assuranceRank
          x-ucm-datatype: xsd:integer
        "governedByPolicy":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "Relates a consent directive, provision or program to the consent policy it relies on (FHIR Consent.policyBasis)."
          x-semantic-uri: https://www.w3.org/ns/ucm#governedByPolicy
          x-ucm-range: ucm:ConsentPolicy
          x-ucm-constraints:
          - severity: Warning
            tier: Recommended
            message: governedByPolicy target is not typed as ucm:ConsentPolicy.
        "hasApplicableLaw":
          type: array
          items:
            $ref: '#/components/schemas/RegulatoryBasis'
          uniqueItems: true
          description: "In UCM: relates a consent directive or policy to the law or regulation it rests on (FHIR Consent.regulatoryBasis), a concept in ucm:RegulatoryBasis."
          x-semantic-uri: https://w3id.org/dpv#hasApplicableLaw
          x-ucm-concept-scheme: RegulatoryBasis
          x-ucm-range: skos:Concept
        "hasCareTrajectoryContext":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "Relates a UCM semantic subject to a temporal position or extent defined relative to the internal progression of a process, state trajectory, or coordinated activity rather than directly relative to an external clock or calendar."
          x-semantic-uri: https://www.w3.org/ns/ucm#hasCareTrajectoryContext
          x-ucm-range: ucm:CareTrajectoryContext
          x-ucm-constraints:
          - severity: Warning
            tier: Recommended
            message: Care trajectory context is not typed as ucm:CareTrajectoryContext.
        "hasConfidentialityLevel":
          $ref: '#/components/schemas/ConfidentialityLevel'
          description: "Relates an information artifact or statement to its confidentiality level (HL7 v3 Confidentiality)."
          x-semantic-uri: https://www.w3.org/ns/ucm#hasConfidentialityLevel
          x-ucm-concept-scheme: ConfidentialityLevel
          x-ucm-range: skos:Concept
          x-ucm-constraints:
          - severity: Violation
            tier: Definitional
            message: Information holds at most one confidentiality level, identified by IRI.
        "hasConsentDecision":
          $ref: '#/components/schemas/ConsentDecision'
          description: "Relates a consent directive or provision to its permit or deny decision. Every provision states its own decision, the opposite of its parent's."
          x-semantic-uri: https://www.w3.org/ns/ucm#hasConsentDecision
          x-ucm-concept-scheme: ConsentDecision
          x-ucm-range: skos:Concept
        "hasConsentModel":
          type: array
          items:
            $ref: '#/components/schemas/ConsentModel'
          uniqueItems: true
          description: "Relates a policy, program or notice to its consent model, such as opt-in or opt-out."
          x-semantic-uri: https://www.w3.org/ns/ucm#hasConsentModel
          x-ucm-concept-scheme: ConsentModel
          x-ucm-range: skos:Concept
        "hasJurisdiction":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
          description: "In UCM: relates a consent, consent interaction, policy or identifier to the jurisdiction context where it was given, is in force or was issued."
          x-semantic-uri: https://w3id.org/dpv#hasJurisdiction
          x-ucm-range: ucm:JurisdictionContext
          x-ucm-constraints:
          - severity: Warning
            tier: Recommended
            message: hasJurisdiction target is not typed as ucm:JurisdictionContext.
        "hasProvision":
          type: array
          items:
            $ref: '#/components/schemas/NodeRef'
          uniqueItems: true
