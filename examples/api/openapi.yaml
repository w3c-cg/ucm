          enum: ["CFR42Part2", "CommonRule", "FERPA", "HIPAA", "HIPAAAuthorization", "HIPAANoticeOfPrivacyPractices", "HIPAAResearch", "HMISDataStandards", "StateLaw", "VAWA", "law-GDPR"]
        - $ref: '#/components/schemas/IRI'
    "RetentionDisposition":
