components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Local identifier of the node. Responses carry its full IRI as @id.
      schema:
        type: string

  responses:
    BadRequest:
      description: The body is not a JSON-LD node object of the expected class.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No node with this identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShapeViolation:
      description: The request graph has Definitional (sh:Violation) results against the UCM core shapes.
      content:
        application/ld+json:
          schema:
            $ref: '#/components/schemas/ValidationReport'

  schemas:
    # ===== Support schemas =====
    "IRI":
      type: string
      format: iri
      description: Absolute IRI, or a term or compact IRI defined by the JSON-LD context.
    "NodeObject":
      type: object
      description: 'Embedded JSON-LD node (e.g., an OWL-Time interval). Open: any predicates.'
      properties:
        '@id':
          $ref: '#/components/schemas/IRI'
        '@type':
          oneOf:
          - type: string
          - type: array
            items:
              type: string
    "NodeRef":
      description: Reference to another node by IRI, or the node embedded inline.
      oneOf:
      - $ref: '#/components/schemas/IRI'
      - $ref: '#/components/schemas/NodeObject'
    "JsonLdContext":
      description: 'JSON-LD @context: the published UCM context URL, an inline context, or both.'
      oneOf:
      - type: string
        format: uri-reference
      - type: object
      - type: array
        items:
          oneOf:
          - type: string
          - type: object
    "Problem":
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    "Severity":
      description: SHACL result severity (sh:Violation, sh:Warning, sh:Info)
      enum:
      - Violation
      - Warning
      - Info
      title: Severity
      type: string
    "Tier":
      description: ucmsh:tier from the UCM core shapes convention
      enum:
      - Definitional
      - Recommended
      title: Tier
      type: string
    "ValidationResult":
      description: One SHACL validation result
      properties:
        focus_node:
          description: Node the result is about
          title: Focus Node
          type: string
        result_path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Property path, if any
          title: Result Path
        value:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Offending value node, if any
          title: Value
        severity:
          $ref: '#/components/schemas/Severity'
        tier:
          anyOf:
          - $ref: '#/components/schemas/Tier'
          - type: 'null'
          default: null
        message:
          title: Message
          type: string
        source_shape:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Shape
      required:
      - focus_node
      - severity
      - message
      title: ValidationResult
      type: object
    "ValidationReport":
      description: SHACL validation report, as returned by write operations
      properties:
        conforms:
          title: Conforms
          type: boolean
        results:
          items:
            $ref: '#/components/schemas/ValidationResult'
          title: Results
          type: array
      required:
      - conforms
      title: ValidationReport
      type: object

    # ===== Concept schemes (open vocabularies) =====
    "AuthenticatorAssuranceLevel":
      description: "Authenticator Assurance Level. How strongly was the claimant authenticated? Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
      x-semantic-uri: "https://www.w3.org/ns/ucm#AuthenticatorAssuranceLevel"
      x-ucm-open-vocabulary: true
      x-ucm-properties: ["achievedAAL", "requiresAAL"]
      x-ucm-concepts:
        AAL1:
          iri: https://www.w3.org/ns/ucm#AAL1
          label: AAL1
          definition: Basic confidence that the claimant controls an authenticator bound to the subscriber account, using single-factor or multi-factor authentication (NIST AAL1).
        AAL2:
          iri: https://www.w3.org/ns/ucm#AAL2
          label: AAL2
          definition: High confidence from proof of possession and control of two distinct authentication factors. Verifiers must offer at least one phishing-resistant option (NIST AAL2).
        AAL3:
          iri: https://www.w3.org/ns/ucm#AAL3
          label: AAL3
          definition: Very high confidence from a phishing-resistant cryptographic authenticator with a non-exportable private key; syncable authenticators are not allowed (NIST AAL3).
      anyOf:
        - type: string
          enum: ["AAL1", "AAL2", "AAL3"]
        - $ref: '#/components/schemas/IRI'
    "BirthDateQuality":
      description: "Birth Date Quality. How reliable is the recorded birth date? Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
      x-semantic-uri: "https://www.w3.org/ns/ucm#BirthDateQuality"
      x-ucm-open-vocabulary: true
      x-ucm-properties: ["birthDateQuality"]
      x-ucm-concepts:
        ApproximateOrPartial:
          iri: https://www.w3.org/ns/ucm#ApproximateOrPartial
          label: Approximate or partial
          definition: 'An approximate or partial date of birth was reported (HMIS: Approximate or partial DOB reported).'
        ClientDoesNotKnow:
          iri: https://www.w3.org/ns/ucm#ClientDoesNotKnow
          label: Client doesn't know
          definition: The person does not know their date of birth. HMIS allows this only with no birth date recorded.
        ClientPreferNotToAnswer:
          iri: https://www.w3.org/ns/ucm#ClientPreferNotToAnswer
          label: Client prefers not to answer
          definition: The person declined to give their date of birth. HMIS allows this only with no birth date recorded.
        DataNotCollected:
          iri: https://www.w3.org/ns/ucm#DataNotCollected
          label: Data not collected
          definition: The date of birth was not collected. HMIS allows this only with no birth date recorded.
        FullDateReported:
          iri: https://www.w3.org/ns/ucm#FullDateReported
          label: Full date reported
          definition: 'The full date of birth was reported (HMIS: Full DOB reported).'
      anyOf:
        - type: string
          enum: ["ApproximateOrPartial", "ClientDoesNotKnow", "ClientPreferNotToAnswer", "DataNotCollected", "FullDateReported"]
        - $ref: '#/components/schemas/IRI'
    "ClosureReason":
      description: "Closure Reason. Why did the care coordination episode end? Open vocabulary: known concepts are listed; other concept IRIs are accepted when SKOS-mapped into the scheme."
      x-semantic-uri: "https://www.w3.org/ns/ucm#ClosureReason"
      x-ucm-open-vocabulary: true
      x-ucm-properties: ["hasClosureReason"]
      x-ucm-concepts:
        ClientDeclined:
          iri: https://www.w3.org/ns/ucm#ClientDeclined
          label: Declined by the person
          definition: The person chose not to receive the requested services.
          broader:
          - ClosedNotConnected
        ClientUnreachable:
          iri: https://www.w3.org/ns/ucm#ClientUnreachable
          label: Person unreachable
          definition: The receiving party could not reach the person.
          broader:
          - ClosedNotConnected
        ClosedConnected:
          iri: https://www.w3.org/ns/ucm#ClosedConnected
          label: Connected
          definition: The person was connected to the requested services.
        ClosedNoLongerNeeded:
          iri: https://www.w3.org/ns/ucm#ClosedNoLongerNeeded
          label: No longer needed
          definition: The need was resolved, or stopped applying, without the requested services.
        ClosedNotConnected:
          iri: https://www.w3.org/ns/ucm#ClosedNotConnected
          label: Not connected
          definition: The episode ended without connecting the person to the requested services. Record a narrower concept when the reason is known.
        Ineligible:
          iri: https://www.w3.org/ns/ucm#Ineligible
          label: Ineligible
          definition: The person does not meet the receiving program's eligibility criteria.
          broader:
          - ClosedNotConnected
        MissingVerification:
          iri: https://www.w3.org/ns/ucm#MissingVerification
          label: Missing verification
          definition: Documentation or verification the receiving party requires was not provided.
          broader:
          - ClosedNotConnected
        OtherClosureReason:
          iri: https://www.w3.org/ns/ucm#OtherClosureReason
          label: Other reason
          definition: Not connected for a reason not listed here.
          broader:
          - ClosedNotConnected
        OutOfArea:
          iri: https://www.w3.org/ns/ucm#OutOfArea
          label: Out of area
