          enum: ["ConsentActive", "ConsentDraft", "ConsentEnteredInError", "ConsentExpired", "ConsentInactive", "ConsentRefused", "ConsentRevoked", "ConsentSuperseded", "ConsentUnknown", "ConsentWithdrawn"]
