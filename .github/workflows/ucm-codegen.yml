# Lint, validate and rebuild the UCM reference artifacts whenever the spec
# (any .ttl) or the toolchain changes.
#
# Paths assume the spec files at the repository root and the toolchain in
# codegen/. The generated reference artifacts land under examples/ (OpenAPI,
# context, fhir/, report.html in examples/api/; SQLAlchemy models + Alembic
# migrations in examples/db/), per codegen/ucm-build.yaml.

name: ucm-codegen

on:
  push:
    paths:
      - "**/*.ttl"
      - "codegen/**"
      - "test-suites/test_core_shapes.py"
      - ".github/workflows/ucm-codegen.yml"
  pull_request:
    paths:
      - "**/*.ttl"
      - "codegen/**"
      - "test-suites/test_core_shapes.py"
      - ".github/workflows/ucm-codegen.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucm-codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codegen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: codegen/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Stage cache (export, URDNA2015, PySHACL, example validation). Entries
      # are keyed by content digests, so restoring an older cache is always
      # safe: changed inputs simply miss.
      - uses: actions/cache@v4
        with:
          path: codegen/build/.cache
          key: ucm-stage-cache-${{ hashFiles('**/*.ttl', 'codegen/src/**', 'codegen/profiles/**') }}
          restore-keys: ucm-stage-cache-

      # Export → lint (SHACL-SHACL, ucm-shapes-lint, consistency) → validate the
      # example → OpenAPI, context, Postgres, FHIR and report.html. A failed
      # build writes only the report, so the uploaded report shows why. The
      # same summary (status, vocabularies, findings, changes) goes on the run
      # page, so reading the result does not need the download.
      - name: Build
        run: ucm-codegen build --strict --summary "$GITHUB_STEP_SUMMARY"

      - name: Tests
        run: pytest

      # The group's shapes suite: baseline, seeded defects, lint, SHACL-SHACL.
      # Exits non-zero on any failure.
      - name: Shapes suite
        working-directory: .
        run: python test-suites/test_core_shapes.py .

      # Only bites for what is committed: if ucm-build.lock, codegen/build/
      # (the IR) and the generated examples/ output are in git, a spec change
      # must ship with its regenerated artifacts. report.html is a view of
      # the build, not an artifact. The generated output lands outside the
      # job's working-directory (examples/, not codegen/), so this step runs
      # from the repo root with paths spelled out in full.
      - name: Committed lockfile and artifacts are current
        working-directory: .
        run: >
          git diff --exit-code --
          codegen/ucm-build.lock
          codegen/build
          examples/api
          examples/db
          ':(exclude)examples/api/report.html'

      - name: Upload reference artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucm-reference
          path: |
            examples/api
            codegen/build
            examples/db
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "Full report: download the **ucm-reference** artifact and open \`api/report.html\`." >> "$GITHUB_STEP_SUMMARY"
