# Deploy the workbench site (doc/github-pages/) to GitHub Pages whenever it
# changes on main. The pages committed there are expected to already be
# current (the workbench workflow checks that on every push and pull
# request); this workflow re-checks before publishing rather than trust a
# merge commit it hasn't itself validated, and never writes to the repo.
#
# Requires the repository's Pages source (Settings > Pages) to be set to
# "GitHub Actions", not "Deploy from a branch" -- see the commit this
# workflow was added in for what to change and why.
#
# doc/github-pages/ has no separate build-output folder: build.py, tests/,
# templates/ and requirements.txt live next to the generated pages
# (implementations/*.html) and assets/, so the whole directory is published,
# source files included.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "doc/github-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/github-pages/requirements.txt

      - name: Install
        run: pip install -r doc/github-pages/requirements.txt

      - name: Pages are current
        run: python doc/github-pages/build.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
