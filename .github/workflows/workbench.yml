# Check the workbench pages (doc/github-pages/) whenever their entries,
# templates or builder change: entries meet the listing criteria, their
# links resolve, and the committed pages match a rebuild. Publishing is a
# separate workflow (pages.yml) that deploys via GitHub Actions on push to
# main, so this workflow never deploys.

name: workbench

on:
  push:
    paths:
      - "doc/github-pages/**"
      - ".github/workflows/workbench.yml"
  pull_request:
    paths:
      - "doc/github-pages/**"
      - ".github/workflows/workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/github-pages/requirements.txt

      - name: Install
        run: pip install -r doc/github-pages/requirements.txt

      - name: Entries meet the listing criteria and pages are current
        run: python doc/github-pages/build.py --check --check-links

      - name: Tests
        run: pytest doc/github-pages/tests
